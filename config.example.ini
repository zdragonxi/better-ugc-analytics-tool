# Roblox Sales Analytics — example configuration.
# Copy to config.ini and edit. Every [app] key can also be set with an RSA_* environment
# variable (see .env.example); the environment wins over this file.
#
# Your cookie does NOT go in this file. Put it in the cookie file below (chmod 600) or in
# the RSA_COOKIE environment variable. See README → "Cookie safety".

[app]
# Where the dashboard listens. 127.0.0.1 = only this computer (recommended).
# Any other address requires password_hash (the app refuses to start without it).
host = 127.0.0.1
port = 8930

# SQLite database (relative paths are relative to this file). Back it up — it is the only
# copy of history older than what Roblox will still page back to.
db_path = data/sales.db

# File holding your .ROBLOSECURITY cookie value (one line). Relative to this file.
cookie_file = roblox_cookie.txt

# Optional outbound HTTP(S) proxy for Roblox requests, e.g. http://user:pass@host:3128
# Roblox may throttle or return incomplete data to requests from datacenter/cloud IP
# ranges; if you host this on a VPS and see frequent 429s or odd gaps, a proxy with a
# residential IP can help. Leave empty to connect directly.
proxy =

# Single-user password, only needed when host is not 127.0.0.1.
# Generate with:  python -m roblox_sales hash-password
password_hash =

# Comma-separated Host header values accepted when you expose the dashboard, e.g.
# allowed_hosts = sales.example.home:8930
# (Loopback addresses are always accepted when host = 127.0.0.1.)
allowed_hosts =

# Also track sales made by the cookie's own user account (not only groups).
track_user_sales = true
user_store_name = My account

# How often to read Roblox (seconds; minimum 60).
sync_interval = 180
financials_interval = 120
# how often to read your current Robux balance for the top-bar pill (no history is kept)
balance_interval = 120

# On the very first sync, how far back to walk each store's sales history.
# Roblox only pages back roughly 10,000 sales per store; import CSV exports for older months.
initial_sync_days = 90

# "Items On Sale": how often to recount (seconds; minimum 600) and which asset types to
# count, as numeric Roblox asset type ids. Default: accessories 8 Hat, 41 Hair, 42 Face,
# 43 Neck, 44 Shoulder, 45 Front, 46 Back, 47 Waist, and layered clothing 64-72.
# Classic clothing (2 T-Shirt, 11 Shirt, 12 Pants) is not in the default because it is
# unverified on this endpoint; if you add it and a type keeps failing, the count stays at
# its last complete value — remove that type again.
catalog_interval = 600
# asset_types = 8,41,42,43,44,45,46,47,64,65,66,67,68,69,70,71,72

# One section per group you own or manage. The number is the group id (from the group's URL).
# name           — display name; changing it later never re-keys stored data
# combine        — include this store in "All stores" and combined totals (default true)
[group:1111111]
name = My First Group
combine = true

# [group:2222222]
# name = Another Group
# combine = false
